# cargo-deny configuration. Run with: cargo deny check
#
# Rule: 100% pure Rust, no C-FFI. Any crate that links native code is banned.
# cargo-deny does not support wildcards in `bans.deny`, so the list below is
# explicit. Extend it whenever a new `-sys` crate shows up in the tree.

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "openssl-sys" },
    { name = "libz-sys" },
    { name = "libsqlite3-sys" },
    { name = "libgit2-sys" },
    { name = "curl-sys" },
    { name = "zstd-sys" },
    { name = "bzip2-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The project's own sibling crates, pinned by commit in Cargo.toml.
allow-git = [
    "https://github.com/tpt-solutions/tpt-crypto",
    "https://github.com/tpt-solutions/tpt-primitives",
    "https://github.com/tpt-solutions/tpt-replicate",
]
