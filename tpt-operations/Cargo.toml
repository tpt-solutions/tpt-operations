[package]
name = "tpt-operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic, reversible, CRDT-compatible operation engine for the TPT stack."

[features]
default = []
# Enables the std-only conveniences (e.g. `std::error::Error` for `OpError`).
std = []
# Re-exports the `#[derive(Operation)]` macro.
derive = ["dep:tpt-operations-derive"]
# Real tpt-uir adapter (stubbed for now).
uir = []
# Real tpt-crypto adapter: SHA-256 digests and Ed25519 signatures.
crypto = ["serde", "dep:tpt-crypto-hash", "dep:tpt-crypto-sig"]
# Real tpt-primitives adapter: maps ActorId to and from Principal.
primitives = ["dep:tpt-primitives"]
# Serialized op log (serde + postcard). Needed for ReplayEngine and the golden log.
serde = ["dep:serde", "dep:postcard"]

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"], optional = true }
tpt-operations-derive = { path = "../tpt-operations-derive", optional = true }
# Pinned to the tpt-crypto commit that was checked when the adapter was written.
tpt-crypto-hash = { git = "https://github.com/tpt-solutions/tpt-crypto", rev = "8b73d9b13cb1432547a03dd58d8cf8d6231e3784", default-features = false, optional = true }
tpt-primitives = { git = "https://github.com/tpt-solutions/tpt-primitives", rev = "336292c8a6f623768c8db5eb7a3082fa407c98f8", optional = true }
tpt-crypto-sig = { git = "https://github.com/tpt-solutions/tpt-crypto", rev = "8b73d9b13cb1432547a03dd58d8cf8d6231e3784", default-features = false, optional = true }

[lints]
workspace = true

[dev-dependencies]
trybuild = "1.0.122"
