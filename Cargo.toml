[workspace]
resolver = "2"
members = ["tpt-operations", "tpt-operations-derive"]
# The template is a project to generate, not a member of this workspace.
exclude = ["templates"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[workspace.lints.clippy]
all = "warn"
