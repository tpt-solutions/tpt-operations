[package]
name = "tpt-operations-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Derive macros for tpt-operations."
readme = "README.md"
repository = "https://github.com/tpt-solutions/tpt-operations"
homepage = "https://github.com/tpt-solutions/tpt-operations"
# Not published yet. It ships together with `tpt-operations`, which cannot be published
# until its git dependencies are released. Remove this line then.
publish = false
keywords = ["derive", "proc-macro", "operation", "undo", "crdt"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full", "extra-traits"] }
